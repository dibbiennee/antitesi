<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>ZAYA · Render · Antitesi</title>

<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&f[]=clash-display@600,700,800&display=swap" rel="stylesheet">
<!-- JetBrains Mono non e' ospitato da Fontshare: va preso da Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #050505;
    --text: #f5f1ea;
    --accent: #e8a03f;
    --accent-soft: #f2c373;
    --accent-deep: #b87420;
    --muted: #4a4138;
    --vinyl: #060606;
    --vinyl-shine: #1a1a1a;
    --font-display: "Clash Display", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--text);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: calc(100dvh * 9 / 16);
    background: var(--bg);
    overflow: hidden;
    isolation: isolate;
  }

  /* No background glow - clean */

  /* Film grain */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    opacity: 0.07;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 50;
  }

  /* Ghost backdrop */
  .ghost {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: 800;
    font-size: 38vw;
    letter-spacing: -0.06em;
    color: rgba(232, 160, 63, 0.045);
    white-space: nowrap;
    z-index: 0;
    pointer-events: none;
    user-select: none;
  }

  /* TOP brand */
  .top {
    position: absolute;
    top: 11%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 6;
  }
  .top-pill {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: var(--accent);
    text-transform: uppercase;
    padding: 18px 34px 18px 28px;
    border: 1.8px solid rgba(232, 160, 63, 0.55);
    background: rgba(232, 160, 63, 0.12);
    border-radius: 999px;
    backdrop-filter: blur(10px);
  }
  .top-pill::before {
    content: "";
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 18px var(--accent);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* VINYL */
  .vinyl-wrap {
    position: absolute;
    top: 47%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 620px;
    aspect-ratio: 1;
    z-index: 3;
    filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.6));
  }

  .vinyl {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%,
        var(--vinyl) 0px,
        var(--vinyl) 2px,
        var(--vinyl-shine) 2px,
        var(--vinyl-shine) 3px);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.05) inset,
      0 0 100px rgba(232, 160, 63, 0.18);
    animation: spin 5s linear infinite;
    overflow: hidden;
  }
  .vinyl::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg at 50% 50%,
      transparent 0deg,
      rgba(232, 160, 63, 0.18) 30deg,
      rgba(245, 241, 234, 0.08) 50deg,
      transparent 90deg,
      transparent 200deg,
      rgba(232, 160, 63, 0.14) 230deg,
      transparent 290deg);
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .label {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 42%;
    aspect-ratio: 1;
    margin-left: -21%;
    margin-top: -21%;
    border-radius: 50%;
    overflow: hidden;
    z-index: 2;
    box-shadow:
      0 0 0 3px var(--vinyl),
      0 0 0 4px rgba(232, 160, 63, 0.45),
      0 0 0 5px rgba(0, 0, 0, 0.6),
      0 8px 18px rgba(0, 0, 0, 0.5) inset;
    animation: spin 5s linear infinite;
  }
  .label-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hole {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: #000;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    z-index: 4;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* BOTTOM (title + secondary + date) */
  .bottom {
    position: absolute;
    bottom: 11%;
    left: 0;
    right: 0;
    z-index: 6;
    padding: 0 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .title {
    font-weight: 800;
    font-size: clamp(86px, 23vw, 152px);
    letter-spacing: -0.04em;
    line-height: 0.9;
    background: linear-gradient(180deg, var(--text) 0%, var(--accent-soft) 60%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    text-shadow: 0 4px 30px rgba(232, 160, 63, 0.35);
    margin-bottom: 4px;
    padding: 0 8px;
  }

  .artist {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 0.18em;
    color: var(--text);
    text-transform: uppercase;
  }

  .date {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.32em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .credit {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: rgba(245, 241, 234, 0.32);
    text-transform: uppercase;
  }

  audio {
    position: absolute;
    left: -9999px;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="ghost">ZAYA</div>

  <div class="top">
    <div class="top-pill">Out Now · 2026</div>
  </div>

  <div class="vinyl-wrap">
    <div class="vinyl"></div>
    <div class="label">
      <img src="/zaya/cover.jpg" alt="Zaya cover" class="label-img" width="800" height="800">
    </div>
    <div class="hole"></div>
  </div>

  <div class="bottom">
    <h1 class="title">ANTITESI</h1>
    <div class="artist">Zaya</div>
    <div class="date">Friday, May 8th</div>
    <div class="credit">by satoshiweb.it</div>
  </div>

</div>

<audio id="audio" preload="auto" src="/zaya/zaya-clip.m4a" crossorigin="anonymous"></audio>

<script>
(function () {
  const audio = document.getElementById('audio');

  // Mark ready (no waveform precompute needed)
  window.__renderReady = true;

  window.__trigger = async function () {
    try {
      audio.currentTime = 0;
      await audio.play();
    } catch (e) {
      console.error('play failed', e);
    }
  };

  document.addEventListener('click', () => window.__trigger(), { once: true });
})();
</script>

</body>
</html>
